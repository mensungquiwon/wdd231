     <link rel="icon" href="../favicon.ico">
    <link rel="stylesheet" href="./styles/color.css">

<body>
  <header class="site-header">
  <h1 class="title">Royal Forex</h1>
  <nav id="nav-bar" class="navigation">
    <ul>
      <li><a href="index.html">Home</a></li>
      <li><a href="loans.html">Micro‑Loans</a></li>
      <li><a href="forex.html">Forex Rates</a></li>
      <li><a href="about.html">About Us</a></li>
      <button id="ham-btn" class="hamburger" aria-label="Toggle navigation menu"></button>
    </ul>
  </nav>
</header>
<main>
    <h2>Micro‑Loan Application</h2>

    <form id="loanForm" method="get" action="thankyou.html">
     <label>First Name <input type="text" name="first" required autocomplete="given-name" title="Your First Name"></label>
          <label>Last Name <input type="text" name="last" required autocomplete="family-name" title="Your Last Name"></label>
          <label>Company / Business Name <input type="text" name="company" required autocomplete="organization" title="Your Company Name" pattern="^[A-Za-z\- ]{7,}$"></label>
          <label>Email <input type="email" name="email" required placeholder="john89@gmail.com"  title="Your Email" autocomplete="email"></label>
          <label>Cell Phone <input type="tel" name="phone" required autocomplete="tel" title="A Phone Number with dashes" placeholder="987-555-1234" ></label>
        <label>Loan Amount (USD)<input type="number" id="amount" min="50" required></label>

        <label>Date<input type="date" id="dateNeeded" required></label>
  

      <label>
        Repayment Period (Months)
        <select id="period" name="period" required>
          <option value="">Select</option>
          <option value="3">3 Months</option>
          <option value="6">6 Months</option>
          <option value="12">12 Months</option>
        </select>
      </label>

      <button type="submit">Request Loan</button>
    </form>
  </main>
</body>
</html>
