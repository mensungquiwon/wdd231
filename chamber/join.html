<div class="layout">
    <main>
      <h1>Join Our Chamber</h1>
  
      <form method="GET" action="thankyou.html" class="designOne">
        <label>First Name <input type="text" name="first" required autocomplete="given-name" title="Your First Name"></label>
          <label>Last Name <input type="text" name="last" required autocomplete="family-name" title="Your Last Name"></label>
          <label>Company / Organization Name <input type="text" name="company" required autocomplete="organization" title="Your Company Name" pattern="^[A-Za-z\- ]{7,}$"></label>
          <label>Email <input type="email" name="email" required placeholder="john89@gmail.com"  title="Your Email" autocomplete="email"></label>
          <label>Cell Phone <input type="tel" name="phone" required autocomplete="tel" title="A Phone Number with dashes" placeholder="987-555-1234" ></label>
  
          <h3>Membership Level</h3>
          <label><input type="radio" name="ordinance" value="Baptism"> np</label>
          <label><input type="radio" name="ordinance" value="Initiatory"> bronze</label>
          <label><input type="radio" name="ordinance" value="Endowment"> silver</label>
          <label><input type="radio" name="ordinance" value="Sealing"> gold</label>
          <label>Message <textarea name="message" title="Business description" placeholder="Description about your business..."></textarea></label>
  
          <h3>Date and Location</h3>
          <input type="hidden" name="date" id="timestamp" required>
  
          <label>Location
            <select name="location" required>
              <option value="">None</option>
              <option value="Payson">Ganta</option>
              <option value="Orem">Sanniquellie</option>
              <option value="Provo City Center">Bahn</option>
              <option value="Yekepa">Yekepa</option>
              <option value="Karnplay">Karnplay</option>
            </select>
          </label>
  
          <input type="submit" value="Schedule An Appointment">
      </form>
  </main>
  <aside id="Membership">
    <h2>Membership Benefits</h2>
    <div id="nonProfit">
      <h3>Non-profit Membership</h3>
      <button id="nonProfitButton">Learn More</button>
    </div>
    <div id="bronze">
          <h3>Bronze Membership</h3>
      <button id="bronzeButton">Learn More</button>
    </div>
    <div id="silver">
      <h3>Silver Membership</h3>
  
      <button id="silverButton">Learn More</button>
    </div>
    <div id="gold">
      <h3>Gold Membership</h3>
      <button id="goldButton">Learn More</button>
    </div>
  
      <dialog id="dialogbox">
          <div></div>
          <button id="closeDialog">Close</button>
      </dialog>
  
  </aside>
</div>
